name: Keep Render service awake

on:
  schedule:
    # Renderの無料プランは15分間アクセスがないとスリープするため、10分おきにpingする
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping deployed service
        run: curl -sf --max-time 20 https://tokyo-dotcomu.onrender.com/api/venues > /dev/null
